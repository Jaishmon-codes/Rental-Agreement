version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TRUST_PROXY=1
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - JWT_SECRET=change_me_to_a_secure_production_secret_32_chars_min
      - DB_PATH=/app/data/rental_database.sqlite
      - DOCUMENT_STORAGE_DIR=/app/uploads
      - WORKER_INTERVAL_MS=5000
    volumes:
      - rentsphere_db_data:/app/data
      - rentsphere_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rentsphere_db_data:
  rentsphere_uploads:
